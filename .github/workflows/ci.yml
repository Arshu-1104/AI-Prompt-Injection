name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m src.load_data
      # After load_data so the real-data leakage tests run instead of skipping.
      - run: pytest -q
      - run: python -m src.train_classical
      - name: Robustness check
        # Gate (maintainer decision): binary flagged-or-not detection on the
        # adversarial suite (SAFE vs not-SAFE) must be >= BINARY_ROBUSTNESS_BASELINE
        # (a fraction, default 0.90). The 3-class exact-match score is printed and
        # stored in the report but does not gate. A new variable name is used so a
        # leftover ROBUSTNESS_BASELINE (the old 3-class gate) cannot apply here.
        env:
          BINARY_ROBUSTNESS_BASELINE: ${{ vars.BINARY_ROBUSTNESS_BASELINE }}
        run: |
          python -m src.robustness
          python - <<'EOF'
          import json, os, sys
          report = json.load(open("artifacts/robustness_report.json", encoding="utf-8"))
          binary = float(report["binary_detection_fraction"])
          exact = float(report["robustness_fraction"])
          baseline = float(os.environ.get("BINARY_ROBUSTNESS_BASELINE") or 0.90)
          if not 0 < baseline <= 1:
              sys.exit(f"BINARY_ROBUSTNESS_BASELINE must be a fraction in (0, 1], got {baseline}")
          print(f"Binary detection {binary:.4f} vs baseline {baseline:.4f} (gating)")
          print(f"3-class exact match {exact:.4f} (reported, not gating)")
          sys.exit(0 if binary >= baseline else 1)
          EOF

  test-postgres:
    # Migrations and the API test suite against a real Postgres (production uses
    # Postgres; SQLite hides type mismatches such as UUID vs VARCHAR columns).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promptguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/promptguard_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/promptguard_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-render.txt -r requirements-dev.txt datasets
      - name: Migrations up, down, up
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: pytest against Postgres
        run: pytest -q

  test-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  test-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run build
