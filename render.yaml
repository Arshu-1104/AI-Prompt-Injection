services:
  - type: web
    name: promptguard-api
    env: python
    buildCommand: pip install -r requirements-render.txt && alembic upgrade head
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Set manually in the Render dashboard: your Neon connection string,
      # e.g. postgresql://user:pass@ep-xxx.neon.tech/dbname?sslmode=require&channel_binding=require
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true