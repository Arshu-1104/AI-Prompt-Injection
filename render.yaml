services:
  - type: web
    name: promptguard-api
    env: python
    # Classical model only. Heavy models (bert/guard) are NOT enabled here on purpose:
    # torch + both models need roughly 1.5-3 GB RAM and Render's free tier has 512 MB.
    # To enable them on a 2 GB+ plan:
    #   buildCommand: pip install -r requirements-render.txt && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements-heavy.txt && alembic upgrade head
    #   env: ENABLE_HEAVY_MODELS=true, BERT_MODEL_ID=Arshu-110405/promptguard-bert,
    #        GUARD_MODEL_ID=Arshu-110405/promptguard-guard, HF_TOKEN (the repos are private)
    buildCommand: pip install -r requirements-render.txt && alembic upgrade head
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Set manually in the Render dashboard: your Neon connection string,
      # e.g. postgresql://user:pass@ep-xxx.neon.tech/dbname?sslmode=require&channel_binding=require
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true